<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DirectShare - Fast & Large File Transfer</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
      display: flex;
      justify-content: center;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 16px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h2 { margin: 0 0 6px 0; color: #38bdf8; font-size: 22px; text-align: center; }
    .limit-tag { font-size: 13px; color: #94a3b8; text-align: center; margin-bottom: 16px; }
    .security-badge {
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid #22c55e;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 16px;
      font-size: 13px;
      color: #4ade80;
      line-height: 1.4;
      text-align: center;
    }
    .box {
      border: 1px solid #334155;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 14px;
      background: #0f172a;
    }
    .box strong { display: block; margin-bottom: 8px; font-size: 14px; color: #e2e8f0; }
    input, button {
      width: 100%;
      padding: 11px;
      margin: 6px 0;
      border-radius: 8px;
      border: none;
      font-size: 14px;
    }
    input[type="text"] { background: #1e293b; color: #fff; border: 1px solid #475569; }
    input[type="file"] { background: #1e293b; color: #94a3b8; border: 1px solid #475569; }
    button {
      background: #0284c7;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    button:active { background: #0369a1; }
    #status {
      font-size: 13px;
      color: #fde047;
      text-align: center;
      min-height: 20px;
      margin-top: 8px;
    }
    .progress-container {
      display: none;
      margin-top: 14px;
      background: #0f172a;
      border-radius: 8px;
      border: 1px solid #334155;
      padding: 12px;
    }
    .progress-bar-bg {
      background: #334155;
      border-radius: 6px;
      height: 12px;
      overflow: hidden;
      margin: 8px 0;
    }
    .progress-bar-fill {
      background: #38bdf8;
      height: 100%;
      width: 0%;
      transition: width 0.1s linear;
    }
    .progress-stats {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>DirectShare</h2>
  <div class="limit-tag">Fast & Direct Transfer | High Speed Chunks</div>

  <div class="security-badge">
    <strong>100% Private (Peer-to-Peer)</strong><br>
    फाइलें सीधे फोन-टू-फोन ट्रांसफर होती हैं। कोई सर्वर स्टोरेज नहीं।
  </div>

  <div class="box">
    <strong>फ़ाइल भेजें (Sender):</strong>
    <p style="font-size: 13px; margin: 4px 0 8px 0; color: #cbd5e1;">
      आपका कोड: <span id="my-id" style="color: #4ade80; font-weight: bold; font-size: 16px;">कोड बन रहा है...</span>
    </p>
    <input type="file" id="file-input">
  </div>

  <div class="box">
    <strong>फ़ाइल प्राप्त करें (Receiver):</strong>
    <input type="text" id="peer-id-input" placeholder="सेंडर का 6 अंकों वाला कोड डालें">
    <button id="connect-btn">Connect & Download</button>
  </div>

  <div id="status">नेटवर्क से कनेक्ट हो रहा है...</div>

  <div class="progress-container" id="progress-box">
    <div class="progress-stats">
      <span id="transfer-percent">0%</span>
      <span id="transfer-speed">0 MB/s</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-fill"></div>
    </div>
    <div class="progress-stats">
      <span id="file-size-info">0 MB / 0 MB</span>
      <span id="file-name-info">फ़ाइल</span>
    </div>
  </div>
</div>

<script>
  const CHUNK_SIZE = 64 * 1024;
  const randomCode = Math.floor(100000 + Math.random() * 900000).toString();
  const peer = new Peer(randomCode);

  const myIdDisplay = document.getElementById('my-id');
  const statusDisplay = document.getElementById('status');
  const fileInput = document.getElementById('file-input');
  const progressBox = document.getElementById('progress-box');
  const progressFill = document.getElementById('progress-fill');
  const transferPercent = document.getElementById('transfer-percent');
  const transferSpeed = document.getElementById('transfer-speed');
  const fileSizeInfo = document.getElementById('file-size-info');
  const fileNameInfo = document.getElementById('file-name-info');

  let selectedFile = null;

  peer.on('open', (id) => {
    myIdDisplay.innerText = id;
    statusDisplay.innerText = "तैयार! अपना कोड दूसरे फोन में डालें।";
  });

  fileInput.addEventListener('change', (e) => {
    selectedFile = e.target.files[0] || null;
    if (selectedFile) {
      const sizeMB = (selectedFile.size / (1024 * 1024)).toFixed(1);
      statusDisplay.innerText = `फ़ाइल सेलेक्टेड: ${selectedFile.name} (${sizeMB} MB)`;
    }
  });

  peer.on('connection', (conn) => {
    statusDisplay.innerText = "फोन कनेक्ट हो गया! फ़ाइल भेजी जा रही है...";
    conn.on('open', () => {
      if (!selectedFile) {
        conn.send({ error: "सेंडर ने कोई फ़ाइल सेलेक्ट नहीं की है!" });
        return;
      }
      sendFileInChunks(conn, selectedFile);
    });
  });

  document.getElementById('connect-btn').addEventListener('click', () => {
    const targetId = document.getElementById('peer-id-input').value.trim();
    if (!targetId) {
      alert("कृपया 6 अंकों का कोड डालें!");
      return;
    }
    statusDisplay.innerText = "सेंडर से कनेक्ट हो रहा है...";
    const conn = peer.connect(targetId);

    let receivedBytes = 0;
    let totalBytes = 0;
    let fileMeta = null;
    let fileChunks = [];
    let startTime = null;

    conn.on('open', () => {
      statusDisplay.innerText = "कनेक्ट हो गया! फ़ाइल का इंतज़ार...";
    });

    conn.on('data', (data) => {
      if (data.error) {
        statusDisplay.innerText = data.error;
        return;
      }

      if (data.type === 'start') {
        fileMeta = data;
        totalBytes = data.filesize;
        receivedBytes = 0;
        fileChunks = [];
        startTime = Date.now();
        progressBox.style.display = 'block';
        fileNameInfo.innerText = data.filename;
        statusDisplay.innerText = "फ़ाइल आ रही है...";
        return;
      }

      if (data.type === 'chunk') {
        fileChunks.push(data.chunk);
        receivedBytes += data.chunk.byteLength;

        const percent = Math.min(100, Math.round((receivedBytes / totalBytes) * 100));
        progressFill.style.width = percent + '%';
        transferPercent.innerText = percent + '%';

        const elapsedSec = (Date.now() - startTime) / 1000;
        const speedMB = elapsedSec > 0 ? (receivedBytes / (1024 * 1024 * elapsedSec)).toFixed(2) : 0;
        transferSpeed.innerText = speedMB + ' MB/s';

        const currMB = (receivedBytes / (1024 * 1024)).toFixed(1);
        const totMB = (totalBytes / (1024 * 1024)).toFixed(1);
        fileSizeInfo.innerText = `${currMB} / ${totMB} MB`;
        return;
      }

      if (data.type === 'end') {
        statusDisplay.innerText = "फ़ाइल पूरी आ गई! सेव हो रही है...";
        const blob = new Blob(fileChunks, { type: fileMeta.filetype });
        const downloadUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = fileMeta.filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        statusDisplay.innerText = "सफलतापूर्वक डाउनलोड हो गया!";
      }
    });
  });

  function sendFileInChunks(conn, file) {
    progressBox.style.display = 'block';
    fileNameInfo.innerText = file.name;
    const totalBytes = file.size;
    let offset = 0;
    const startTime = Date.now();

    conn.send({
      type: 'start',
      filename: file.name,
      filetype: file.type,
      filesize: file.size
    });

    function readNextChunk() {
      if (offset >= totalBytes) {
        conn.send({ type: 'end' });
        statusDisplay.innerText = "फ़ाइल पूरी भेजी जा चुकी है!";
        return;
      }

      const slice = file.slice(offset, offset + CHUNK_SIZE);
      const reader = new FileReader();
      reader.onload = (e) => {
        conn.send({
          type: 'chunk',
          chunk: e.target.result
        });
        offset += e.target.result.byteLength;

        const percent = Math.min(100, Math.round((offset / totalBytes) * 100));
        progressFill.style.width = percent + '%';
        transferPercent.innerText = percent + '%';

        const elapsedSec = (Date.now() - startTime) / 1000;
        const speedMB = elapsedSec > 0 ? (offset / (1024 * 1024 * elapsedSec)).toFixed(2) : 0;
        transferSpeed.innerText = speedMB + ' MB/s';

        const currMB = (offset / (1024 * 1024)).toFixed(1);
        const totMB = (totalBytes / (1024 * 1024)).toFixed(1);
        fileSizeInfo.innerText = `${currMB} / ${totMB} MB`;

        setTimeout(readNextChunk, 2);
      };
      reader.readAsArrayBuffer(slice);
    }
    readNextChunk();
  }
</script>

</body>
</html>
