<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DirectShare Pro - Multi-File P2P</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #1e293b, #0f172a);
      color: #f8fafc;
      min-height: 100vh;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 24px;
      border-radius: 20px;
      max-width: 460px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    h2 {
      font-size: 24px;
      font-weight: 700;
      text-align: center;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 13px;
      color: #94a3b8;
      text-align: center;
      margin-bottom: 16px;
    }
    .box {
      border: 1px solid #334155;
      padding: 14px;
      border-radius: 14px;
      margin-bottom: 14px;
      background: rgba(15, 23, 42, 0.6);
    }
    .box-title {
      font-size: 14px;
      font-weight: 600;
      color: #38bdf8;
      margin-bottom: 10px;
      display: block;
    }
    .code-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1e293b;
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 10px;
    }
    .code-val {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #4ade80;
    }
    button, input[type="file"], input[type="text"] {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #fff;
      font-size: 14px;
    }
    button {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:active { opacity: 0.85; }
    .btn-scanner {
      background: linear-gradient(135deg, #059669, #10b981);
    }
    #qrcode {
      display: flex;
      justify-content: center;
      margin: 12px 0;
      background: #fff;
      padding: 10px;
      border-radius: 10px;
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
    }
    #reader {
      width: 100%;
      margin-top: 10px;
      border-radius: 10px;
      overflow: hidden;
      display: none;
    }
    #status {
      font-size: 13px;
      color: #fde047;
      text-align: center;
      min-height: 20px;
      margin-top: 10px;
    }
    .progress-box {
      display: none;
      margin-top: 14px;
      padding: 14px;
      border-radius: 12px;
      background: #0f172a;
      border: 1px solid #334155;
    }
    .progress-bar-bg {
      background: #334155;
      height: 12px;
      border-radius: 6px;
      overflow: hidden;
      margin: 8px 0;
    }
    .progress-bar-fill {
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      height: 100%;
      width: 0%;
      transition: width 0.1s linear;
    }
    .stats-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

<div class="card">
   <!-- Top Banner Ad 320x50 -->
  <div style="width: 100%; margin: 10px auto 16px auto; text-align: center; display: flex; justify-content: center; min-height: 50px;">
    <script type="text/javascript">
      atOptions = {
        'key' : '21aad1c2b4d5b3ac25b631f036ff53bc',
        'format' : 'iframe',
        'height' : 50,
        'width' : 320,
        'params' : {}
      };
    </script>
    <script type="text/javascript" src="//www.highperformanceformat.com/21aad1c2b4d5b3ac25b631f036ff53bc/invoke.js"></script>
  </div>

  
  <h2>DirectShare Pro</h2>
  <div class="subtitle">Direct P2P • High Speed • Encrypted</div>

  <!-- SENDER BOX -->
  <div class="box">
    <span class="box-title">📤 भेजें (Sender)</span>
    <div class="code-box">
      <span style="font-size: 13px; color:#cbd5e1;">कनेक्शन कोड:</span>
      <span id="my-id" class="code-val">जनरेट हो रहा...</span>
    </div>
    
    <div id="qrcode"></div>

    <label style="font-size: 12px; color: #94a3b8;">एक या कई फ़ाइलें चुनें:</label>
    <input type="file" id="file-input" multiple>
  </div>

  <!-- RECEIVER BOX -->
  <div class="box">
    <span class="box-title">📥 प्राप्त करें (Receiver)</span>
    <button id="scan-qr-btn" class="btn-scanner">📷 कैमरा से QR कोड स्कैन करें</button>
    <div id="reader"></div>

    <input type="text" id="peer-id-input" placeholder="या 6 अंकों का कोड यहाँ लिखें">
    <button id="connect-btn">Connect & Download</button>
  </div>

  <div id="status">नेटवर्क से कनेक्ट हो रहा है...</div>

  <!-- PROGRESS TRACKER -->
  <div class="progress-box" id="progress-box">
    <div class="stats-row">
      <span id="transfer-percent">0%</span>
      <span id="transfer-speed">0 MB/s</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-fill"></div>
    </div>
    <div class="stats-row">
      <span id="file-size-info">0 MB / 0 MB</span>
      <span id="file-name-info">फ़ाइल प्रगति</span>
    </div>
  </div>
</div>

<script>
  const CHUNK_SIZE = 64 * 1024;
  const randomCode = Math.floor(100000 + Math.random() * 900000).toString();
  const peer = new Peer(randomCode);

  let selectedFiles = [];
  let html5QrCode = null;

  const myIdDisplay = document.getElementById('my-id');
  const statusDisplay = document.getElementById('status');
  const fileInput = document.getElementById('file-input');
  const progressBox = document.getElementById('progress-box');
  const progressFill = document.getElementById('progress-fill');
  const transferPercent = document.getElementById('transfer-percent');
  const transferSpeed = document.getElementById('transfer-speed');
  const fileSizeInfo = document.getElementById('file-size-info');
  const fileNameInfo = document.getElementById('file-name-info');

  peer.on('open', (id) => {
    myIdDisplay.innerText = id;
    statusDisplay.innerText = "तैयार! QR कोड स्कैन करें या कोड शेयर करें।";
    new QRCode(document.getElementById("qrcode"), {
      text: id,
      width: 130,
      height: 130
    });
  });

  fileInput.addEventListener('change', (e) => {
    selectedFiles = Array.from(e.target.files);
    if (selectedFiles.length > 0) {
      statusDisplay.innerText = `${selectedFiles.length} फ़ाइल(ें) सेलेक्ट की गईं।`;
    }
  });

  peer.on('connection', (conn) => {
    statusDisplay.innerText = "डिवाइस कनेक्ट हो गई! फ़ाइलें भेजी जा रही हैं...";
    conn.on('open', () => {
      if (!selectedFiles.length) {
        conn.send({ type: 'error', message: "सेंडर ने कोई फ़ाइल सेलेक्ट नहीं की!" });
        return;
      }
      sendAllFiles(conn, selectedFiles);
    });
  });

  // QR Scanner Toggle
  document.getElementById('scan-qr-btn').addEventListener('click', () => {
    const readerDiv = document.getElementById('reader');
    if (readerDiv.style.display === 'block') {
      if (html5QrCode) html5QrCode.stop();
      readerDiv.style.display = 'none';
      return;
    }

    readerDiv.style.display = 'block';
    html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 200 },
      (decodedText) => {
        document.getElementById('peer-id-input').value = decodedText;
        html5QrCode.stop();
        readerDiv.style.display = 'none';
        document.getElementById('connect-btn').click();
      },
      () => {}
    ).catch(err => {
      alert("कैमरा चालू नहीं हो सका: " + err);
      readerDiv.style.display = 'none';
    });
  });

  // Receiver Connect
  document.getElementById('connect-btn').addEventListener('click', () => {
    const targetId = document.getElementById('peer-id-input').value.trim();
    if (!targetId) {
      alert("कृपया कोड डालें या QR स्कैन करें!");
      return;
    }
    statusDisplay.innerText = "सेंडर से कनेक्ट हो रहा है...";
    const conn = peer.connect(targetId);

    let currentMeta = null;
    let receivedBytes = 0;
    let fileChunks = [];
    let startTime = null;

    conn.on('open', () => {
      statusDisplay.innerText = "सफलतापूर्वक कनेक्ट हो गया! डेटा आ रहा है...";
    });

    conn.on('data', (data) => {
      if (data.type === 'error') {
        statusDisplay.innerText = data.message;
        return;
      }

      if (data.type === 'start') {
        currentMeta = data;
        receivedBytes = 0;
        fileChunks = [];
        startTime = Date.now();
        progressBox.style.display = 'block';
        fileNameInfo.innerText = `(${data.index}/${data.totalFiles}) ${data.filename}`;
        statusDisplay.innerText = `फ़ाइल डाउनलोड हो रही है: ${data.filename}`;
        return;
      }

      if (data.type === 'chunk') {
        fileChunks.push(data.chunk);
        receivedBytes += data.chunk.byteLength;

        const percent = Math.min(100, Math.round((receivedBytes / currentMeta.filesize) * 100));
        progressFill.style.width = percent + '%';
        transferPercent.innerText = percent + '%';

        const elapsed = (Date.now() - startTime) / 1000;
        const speed = elapsed > 0 ? (receivedBytes / (1024 * 1024 * elapsed)).toFixed(2) : 0;
        transferSpeed.innerText = speed + ' MB/s';

        const currMB = (receivedBytes / (1024 * 1024)).toFixed(1);
        const totMB = (currentMeta.filesize / (1024 * 1024)).toFixed(1);
        fileSizeInfo.innerText = `${currMB} / ${totMB} MB`;
        return;
      }

      if (data.type === 'end') {
        const blob = new Blob(fileChunks, { type: currentMeta.filetype });
        const downloadUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = currentMeta.filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        if (data.isAllDone) {
          statusDisplay.innerText = "सभी फ़ाइलें सफलतापूर्वक सेव हो गईं!";
        }
      }
    });
  });

  async function sendAllFiles(conn, files) {
    progressBox.style.display = 'block';
    for (let i = 0; i < files.length; i++) {
      await sendSingleFile(conn, files[i], i + 1, files.length);
    }
    statusDisplay.innerText = "सभी फ़ाइलें सफलतापूर्वक भेजी गईं!";
  }

  function sendSingleFile(conn, file, index, totalFiles) {
    return new Promise((resolve) => {
      fileNameInfo.innerText = `(${index}/${totalFiles}) ${file.name}`;
      const totalBytes = file.size;
      let offset = 0;
      const startTime = Date.now();

      conn.send({
        type: 'start',
        filename: file.name,
        filetype: file.type,
        filesize: file.size,
        index: index,
        totalFiles: totalFiles
      });

      function readNext() {
        if (offset >= totalBytes) {
          conn.send({ type: 'end', isAllDone: index === totalFiles });
          resolve();
          return;
        }

        const slice = file.slice(offset, offset + CHUNK_SIZE);
        const reader = new FileReader();
        reader.onload = (e) => {
          conn.send({ type: 'chunk', chunk: e.target.result });
          offset += e.target.result.byteLength;

          const percent = Math.min(100, Math.round((offset / totalBytes) * 100));
          progressFill.style.width = percent + '%';
          transferPercent.innerText = percent + '%';

          const elapsed = (Date.now() - startTime) / 1000;
          const speed = elapsed > 0 ? (offset / (1024 * 1024 * elapsed)).toFixed(2) : 0;
          transferSpeed.innerText = speed + ' MB/s';

          const currMB = (offset / (1024 * 1024)).toFixed(1);
          const totMB = (totalBytes / (1024 * 1024)).toFixed(1);
          fileSizeInfo.innerText = `${currMB} / ${totMB} MB`;

          setTimeout(readNext, 2);
        };
        reader.readAsArrayBuffer(slice);
      }
      readNext();
    });
  }
</script>

</body>
</html>
